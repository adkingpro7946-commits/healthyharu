name: 매일 건강 칼럼 자동 발행

# 매일 한국시간 06:00 (= UTC 21:00 전날) 실행. 수동 실행도 가능.
# 흐름: 칼럼 생성(A등급 생활·웰빙) → 안전 검사 통과분만 → 사이트맵/dist 빌드 → Cloudflare 배포 → 커밋
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 동시에 두 번 돌지 않도록(중복 발행 방지)
concurrency:
  group: daily-column
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 사이트맵 lastmod를 실제 커밋 날짜로 계산하려면 전체 히스토리 필요

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Python 준비(사이트맵·dist 빌드용)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 칼럼 생성 + 안전 검사
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node scripts/generate-column.ts
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = 발행됨, 3 = 남은 주제 없음(정상), 그 외 = 실패(안전검사 포함) → 발행 중단
          if [ "$code" = "3" ]; then exit 0; fi
          exit $code

      - name: 사이트맵·dist 빌드
        if: steps.gen.outputs.exit_code == '0'
        run: |
          python3 gen_sitemap.py
          python3 build_dist.py

      - name: Cloudflare 배포
        if: steps.gen.outputs.exit_code == '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy

      - name: 변경분 커밋·푸시
        if: steps.gen.outputs.exit_code == '0'
        run: |
          git config user.name "healthyharu-bot"
          git config user.email "adkingpro7946@gmail.com"
          git add columns/ sitemap.xml
          git commit -m "content: 오늘의 건강 칼럼 자동 발행 [skip ci]" || echo "변경 없음"
          git push
