<body data-page="tools">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="hero" id="sc-top">
      <div class="container">
        <h1>🩺 증상 자가진단</h1>
        <p class="lead">아픈 부위와 증상을 눌러보세요. 관련 있을 수 있는 상태와
          <b>병원에 꼭 가야 하는 신호</b>, 집에서 할 수 있는 관리를 알려드립니다.</p>
      </div>
    </section>

    <section class="section">
      <div class="container tool-wrap">

        <div class="disclaimer-box"><span class="di-icon">⚠️</span>
          이 도구는 <b>참고용</b>입니다. 진단·처방이 아니며, 결과와 관계없이 증상이 있으면 의료기관을 이용하세요.</div>

          <div class="choice-grid" id="sc-parts"><p class="muted">불러오는 중…</p></div>
        </div>

        <!-- 2단계 -->
        <div class="tool-step hidden" id="sc-step2">
          <h2><span class="step-num">2</span>증상을 골라주세요</h2>
          <div class="choice-grid" id="sc-symptom-list"></div>
        </div>

        <div class="tool-step hidden" id="sc-step3">
          <h2><span class="step-num">3</span><span id="sc-detail-title">해당되는 것을 눌러주세요</span></h2>
          <div class="check-list" id="sc-detail-list"></div>
          <div class="text-center mt-lg">
            <button type="button" class="btn btn-primary btn-lg" id="sc-show-result">결과 보기</button>
          </div>
        </div>

        <!-- 결과 -->
        <div id="sc-result" class="hidden" aria-live="polite"></div>

      </div>
    </section>
